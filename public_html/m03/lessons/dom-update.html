<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOM Update Check</title>
</head>
<body>
  <main>
    <h1>DOM Update Check</h1>
    <p id="status">Waiting for click</p>
    <button id="changeStatus" type="button">Change Status</button>
  </main>

  <script>
    const status = document.querySelector("#status");
    const button = document.querySelector("#changeStatus");

    // Confirms both selectors found an element.
    console.log(status, button);

    button.addEventListener("click", function () {
      status.textContent = "Button clicked!";
    });
  </script>
</body>
</html>
