<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Old Style Tags</title>
  <style>
    .note{
        text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <!-- Old code you may see -->
    <font color="red">Warning</font>
    <center>Welcome</center>
    <big>Larger text</big>
    <strike>Old price</strike>
    <b>Remember this</b>
    <i>Latin term</i>
    <u>Not a link</u>

    <!-- Better modern choices -->
    <strong>Warning</strong>
    <em>Remember this</em>
    <span class="note">Not a link</span>
  </main>
</body>
</html>
